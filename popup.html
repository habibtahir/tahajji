<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <link rel="stylesheet" type="text/css" href="css/popup.css" >
    <link rel="stylesheet" type="text/css" href="css/switch.css" >
  </head>
  <body style="width: 160px;">

    <div class="onoffswitch" style="text-align: right;">
      <label class="toggle">
        <span class="toggle-label" id="switchActiveLabel" style="font-weight: 700;">Enabled</span>
        <input class="toggle-checkbox" type="checkbox" id="switchActive" checked>
        <div class="toggle-switch"></div>
      </label>
    </div>

    <hr/>

    <div class="font-size">
      Font Size:
      <div class="value-button minus" id="fs-decrease">-</div>
      <input type="text" id="fs-number" value="100%" disabled="disabled" />
      <div class="value-button plus" id="fs-increase">+</div>
    </div>

    <hr/>

    <div class="line-height">
      Line Height:
      <div class="value-button minus" id="lh-decrease">-</div>
      <input type="text" id="lh-number" value="100%" disabled="disabled" />
      <div class="value-button plus" id="lh-increase">+</div>
    </div>

    <hr/>

    <div style="text-align: center; font-size: 11px; color: #777;">Urdu and Arabic fonts are applied automatically based on detected language.</div>

    <script src="popup.js"></script>
  </body>
</html>
